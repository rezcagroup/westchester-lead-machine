name: Refresh Westchester data

# Pulls the county referrals, rebuilds index.html, commits any change and republishes GitHub Pages. Runs every morning.
on:
  schedule:
    - cron: "17 11 * * *" # 11:17 UTC, about 6 am in New York
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-westchester
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull county referrals
        run: python3 pull_westchester.py

      - name: Build pages
        run: python3 build.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "westchester-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/ev.json data/att.json src/script.js index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh Westchester data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Republish GitHub Pages
        # Pushes made by a workflow do not always start a Pages build, so ask for one.
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
