# Pulls fresh NYC DOB filings and Westchester County referrals every morning, rebuilds both pages
# and publishes them with GitHub Pages.
# Needs: this file on the default branch, and Settings -> Pages -> Source set to "GitHub Actions".
# Nothing is committed back to the repo; the refreshed pages only go to the published site.
name: Refresh and publish

on:
  schedule:
    - cron: "17 10 * * *"   # daily, about 5-6am New York time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull NYC DOB filings
        # If NYC Open Data is down, publish with the NYC data already in the repo.
        continue-on-error: true
        env:
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
        run: python3 pull_nyc.py
      - name: Pull Westchester County referrals
        # If the county service is down, publish with the Westchester data already in the repo.
        continue-on-error: true
        run: python3 pull_westchester.py
      - name: Build pages
        run: |
          python3 build.py
          mkdir _site
          cp index.html nyc.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
