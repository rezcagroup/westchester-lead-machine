<!--

  To change the content, edit the PAGES list in the script at the bottom of this file.
  Each box is [kind, title, text]; kind is g (government step or rule), s (step in order),
  o (other agency or extra step, only when it applies) or h (someone gets hired here).
  A "\n" in the text is a line break. Rows whose boxes are all "s" get the left-to-right arrows.

  To make the PDF: run  node docs/print_pdf.cjs  (needs Playwright), or open this file in
  Chrome and print to PDF (Letter, default margins, background graphics on).
-->

/* ------------------------------------------------------------------ rendering */
const NS = "http://www.w3.org/2000/svg";
const INK = "#828685";            // connector colour
const BW = 594.6, GAP = 9;        // width of the box area, gap between boxes
const LINK_H = 30.75, BUS = 15.5; // space between rows, height of the horizontal line in it

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function svg(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function centres(n) {
  const w = (BW - GAP * (n - 1)) / n;
  return Array.from({ length: n }, (_, i) => i * (w + GAP) + w / 2);
}
const isSeq = row => row.b.every(b => b[0] === "s");

function linkBetween(a, b) {
  const wrap = el("div", "link");
  if (b.link === "none") return wrap;
  const s = svg("svg", { width: BW, height: LINK_H, viewBox: `0 0 ${BW} ${LINK_H}` });
  const ca = centres(a.b.length), cb = centres(b.b.length);
  const from = isSeq(a) ? [ca[ca.length - 1]] : ca;   // a finished sequence hands on from its last step
  const to = isSeq(b) ? [cb[0]] : cb;                 // a sequence is entered at its first step
  const line = (x1, y1, x2, y2) => s.appendChild(svg("line", { x1, y1, x2, y2, stroke: INK, "stroke-width": 1 }));
  from.forEach(x => line(x, 0, x, BUS));
  const all = from.concat(to);
  line(Math.min(...all), BUS, Math.max(...all), BUS);
  to.forEach(x => {
    line(x, BUS, x, 23.5);
    s.appendChild(svg("polygon", { points: `${x - 3.5},23 ${x + 3.5},23 ${x},28.6`, fill: INK }));
  });
  wrap.appendChild(s);
  return wrap;
}

function renderRow(row) {
  const r = el("div", "row");
  const lab = el("div", "label", row.l);
  if (row.ls) lab.appendChild(el("em", null, row.ls));
  r.appendChild(lab);
  const boxes = el("div", "boxes");
  boxes.style.gridTemplateColumns = `repeat(${row.b.length}, 1fr)`;
  const seq = isSeq(row);
  row.b.forEach(([kind, title, text], i) => {
    const b = el("div", "box " + kind);
    b.appendChild(el("b", null, title));
    const p = el("p");
    text.split("\n").forEach((ln, j) => { if (j) p.appendChild(document.createElement("br")); p.appendChild(document.createTextNode(ln)); });
    b.appendChild(p);
    if (seq && i < row.b.length - 1) {
      const a = svg("svg", { class: "nx", width: 9, height: 8, viewBox: "0 0 9 8" });
      a.appendChild(svg("line", { x1: 0, y1: 4, x2: 3, y2: 4, stroke: INK, "stroke-width": 1 }));
      a.appendChild(svg("polygon", { points: "2,0.5 7.6,4 2,7.5", fill: INK }));
      b.appendChild(a);
    }
    boxes.appendChild(b);
  });
  r.appendChild(boxes);
  return r;
}

function renderPage(pg, first) {
  const sec = el("section", "page");
  if (first) {
    sec.appendChild(el("h1", null, "How a construction project gets approved and built"));
    sec.appendChild(el("p", "lede", "Every step for a private project in Westchester County (pages 1–5) and New York City (pages 6–10), from controlling the site to the certificate of occupancy. Small jobs skip most of the land-use steps; boards, fees and local rules differ by municipality. Checked against the law in force in November 2026."));
    const lg = el("div", "legend");
    [["g", "Government step or rule"], ["s", "Steps in order, left to right"], ["o", "Other agency or extra step, only when it applies"], ["h", "Someone gets hired here"]]
      .forEach(([k, t]) => { const sp = el("span"); sp.appendChild(el("i", k)); sp.appendChild(document.createTextNode(t)); lg.appendChild(sp); });
    sec.appendChild(lg);
  }
  sec.appendChild(el("h2", null, pg.h2));
  sec.appendChild(el("p", "desc", pg.desc));
  const d = el("div", "diagram");
  pg.rows.forEach((row, i) => {
    if (i) d.appendChild(linkBetween(pg.rows[i - 1], row));
    d.appendChild(renderRow(row));
  });
  sec.appendChild(d);
  sec.appendChild(el("p", "caption", pg.cap));
  const notes = el("div", "notes");
  pg.notes.forEach(([h, t]) => { const n = el("div", "note"); n.appendChild(el("h3", null, h)); n.appendChild(el("p", null, t)); notes.appendChild(n); });
  sec.appendChild(notes);
  return sec;
}
PAGES.forEach((pg, i) => document.body.appendChild(renderPage(pg, i === 0)));
